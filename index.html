<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Song Prediction Reveal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    button {
      background-color: #ff4444;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.3s ease;
    }
    button:hover {
      background-color: #ff2222;
    }
  </style>
</head>
<body>

  <h1>🎧 Your Song Prediction is Ready!</h1>
  <p>Click the button below to reveal the song in the YouTube app.</p>

  <button id="playButton">▶️ Open in YouTube App</button>

  <script>
    // Replace this with dynamic value from Firebase or control system
    const youtubeLink = "https://www.youtube.com/watch?v=dQw4w9WgXcQ"; // example link
    const videoId = youtubeLink.split("v=")[1].split("&")[0]; // Extract video ID
    const startSeconds = 60; // Start from 1 minute

    document.getElementById("playButton").onclick = () => {
      // Attempt to open in YouTube App
      window.location.href = `vnd.youtube://${videoId}?t=${startSeconds}`;

      // Fallback to browser if app doesn't open
      setTimeout(() => {
        window.location.href = `https://www.youtube.com/watch?v=${videoId}&t=${startSeconds}s`;
      }, 2000);
    };
  </script>

</body>
</html>
