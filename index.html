<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Song Prediction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
    }
  </style>
</head>
<body>

  <h1>🎶 Your Prediction is Loading...</h1>
  <p>Please wait while we open your song in the YouTube app.</p>

  <script>
    // Your YouTube link and start time
    const youtubeLink = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
    const videoId = youtubeLink.split("v=")[1].split("&")[0];
    const startSeconds = 60;

    // Try to open in YouTube app
    window.location.href = `vnd.youtube://${videoId}?t=${startSeconds}`;

    // Fallback to YouTube in browser after 2 seconds
    setTimeout(() => {
      window.location.href = `https://www.youtube.com/watch?v=${videoId}&t=${startSeconds}s`;
    }, 2000);
  </script>

</body>
</html>
