<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prediction Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding-top: 100px;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>

  <h1>🔮 Waiting for your prediction...</h1>
  <p>This page will automatically redirect when ready.</p>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyAW28lwxCv0El4DcKKZqKcGEG1PQQhSZE8",
      authDomain: "illumeos-song-prediction.firebaseapp.com",
      projectId: "illumeos-song-prediction",
      storageBucket: "illumeos-song-prediction.appspot.com",
      messagingSenderId: "734906911857",
      appId: "1:734906911857:web:4e69b3c06527f18fbadfd0",
      measurementId: "G-KCK8PD8F64",
      databaseURL: "https://illumeos-song-prediction-default-rtdb.firebaseio.com"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Get room from URL
    const urlParams = new URLSearchParams(window.location.search);
    const room = urlParams.get("room");

    if (!room) {
      document.body.innerHTML = "<h2>❌ No room ID provided in URL.</h2><p>Use ?room=yourRoomId</p>";
      throw new Error("No room ID provided");
    }

    // Listen for YouTube link in that room
    db.ref("rooms/" + room + "/youtubeLink").on("value", (snapshot) => {
      const youtubeLink = snapshot.val();
      if (youtubeLink) {
        const videoId = youtubeLink.split("v=")[1].split("&")[0];
        const startSeconds = 60;

        // Try to open in YouTube app
        window.location.href = `vnd.youtube://${videoId}?t=${startSeconds}`;

        // Fallback to browser
        setTimeout(() => {
          window.location.href = `https://www.youtube.com/watch?v=${videoId}&t=${startSeconds}s`;
        }, 2000);
      }
    });
  </script>

</body>
</html>
