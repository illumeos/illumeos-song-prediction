<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Control Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding-top: 100px;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
      border-radius: 5px;
    }
    input {
      width: 300px;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>

  <h1>🎛️ Song Prediction Control</h1>
  <p>Enter a YouTube video link:</p>

  <input type="text" id="ytLink" placeholder="https://www.youtube.com/watch?v=...">
  <br>
  <button onclick="sendLink()">Send Prediction</button>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAW28lwxCv0El4DcKKZqKcGEG1PQQhSZE8",
      authDomain: "illumeos-song-prediction.firebaseapp.com",
      projectId: "illumeos-song-prediction",
      storageBucket: "illumeos-song-prediction.appspot.com",
      messagingSenderId: "734906911857",
      appId: "1:734906911857:web:4e69b3c06527f18fbadfd0",
      measurementId: "G-KCK8PD8F64",
      databaseURL: "https://illumeos-song-prediction-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const room = "abc123";

    function sendLink() {
      const link = document.getElementById("ytLink").value;
      if (!link.includes("youtube.com/watch?v=")) {
        alert("Please enter a valid YouTube link.");
        return;
      }
      db.ref("rooms/" + room).set({ youtubeLink: link });
      alert("Prediction sent!");
    }
  </script>

</body>
</html>
