<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Song Prediction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding-top: 100px;
    }
  </style>
</head>
<body>

  <h1>🔮 Predicting Your Song...</h1>
  <p>Please wait while we reveal it.</p>

  <script>
    // Song link and starting time
    const youtubeLink = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
    const startSeconds = 60;
    const videoId = youtubeLink.split("v=")[1].split("&")[0];

    // Try to open YouTube app
    const youtubeAppUrl = `vnd.youtube://${videoId}?t=${startSeconds}`;
    window.location.href = youtubeAppUrl;

    // Fallback to browser version after 2 seconds
    setTimeout(() => {
      const browserUrl = `https://www.youtube.com/watch?v=${videoId}&t=${startSeconds}s`;
      window.location.href = browserUrl;
    }, 2000);
  </script>

</body>
</html>
