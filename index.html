<!DOCTYPE html>
<html>
<head>
  <title>Audience - Illumeos Song</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>
  <h1>🎵 Waiting for your song...</h1>
  <p id="status">The video will play shortly...</p>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAW28lwxCv0El4DcKKZqKcGEG1PQQhSZE8",
      authDomain: "illumeos-song-prediction.firebaseapp.com",
      projectId: "illumeos-song-prediction",
      storageBucket: "illumeos-song-prediction.appspot.com",
      messagingSenderId: "734906911857",
      appId: "1:734906911857:web:4e69b3c06527f18fbadfd0",
      measurementId: "G-KCK8PD8F64",
      databaseURL: "https://illumeos-song-prediction-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const params = new URLSearchParams(window.location.search);
    const roomId = params.get('room');

    if (!roomId) {
      document.body.innerHTML = "<h2>❗ Room ID missing in URL</h2>";
    } else {
      const ref = db.ref('rooms/' + roomId + '/link');
      ref.on('value', (snapshot) => {
        const url = snapshot.val();
        if (url) {
          const updatedUrl = addStartTime(url, 60); // start at 60 seconds
          document.getElementById("status").innerText = "✅ Song received! Redirecting now...";
          window.location.href = updatedUrl;
        }
      });
    }

    function addStartTime(url, seconds) {
      if (url.includes("youtube.com") || url.includes("youtu.be")) {
        if (url.includes("?")) {
          return url + "&t=" + seconds + "s";
        } else {
          return url + "?t=" + seconds + "s";
        }
      }
      return url; // fallback, no changes
    }
  </script>
</body>
</html>
